name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Umgebung
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r requirements_test.txt
      - name: Ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: mypy
        run: .venv/bin/mypy
      - name: pytest
        run: .venv/bin/pytest
